<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مختبر الجرعات — جدول الضرب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd54a;--ink:#2b1650}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#120a22;overflow:hidden;font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;color:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;width:1280px;height:720px;left:50%;top:50%;transform-origin:center center;overflow:hidden;border-radius:18px;box-shadow:0 20px 80px #000a}
#world{position:absolute;inset:0}
#bgv{width:100%;height:100%;object-fit:cover;display:block}
#bg{position:absolute;inset:-12px;background:url(img/bg.jpg) center/cover no-repeat;animation:bgdrift 18s ease-in-out infinite alternate}
@keyframes bgdrift{from{transform:scale(1.02) translateX(-6px)}to{transform:scale(1.04) translateX(6px)}}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,#ffcf6ecc 0,#ffb84a55 35%,transparent 70%);animation:flick 2.8s infinite}
@keyframes flick{0%,100%{opacity:.75;transform:scale(1)}20%{opacity:1;transform:scale(1.08)}45%{opacity:.6}70%{opacity:.95;transform:scale(1.03)}}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,#12062a99 100%)}
canvas{position:absolute;inset:0;pointer-events:none}
#fx{z-index:30}#amb{z-index:2}

/* scientist */
#sci{position:absolute;left:17px;top:86px;width:620px;height:620px;z-index:8;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
#sci img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 18px #0008);transition:opacity .15s}
#sci .soot{opacity:0}
#sci.dirty .soot{opacity:1}#sci.dirty .happy{opacity:0}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
#sci.lean{animation:lean .5s ease-in-out infinite alternate}
@keyframes lean{from{transform:rotate(3deg) translateX(10px)}to{transform:rotate(6deg) translateX(22px)}}
#sci.jump{animation:jump .9s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes jump{0%{transform:translateY(0) scale(1.05,.95)}35%{transform:translateY(-70px) scale(.96,1.06) rotate(-4deg)}65%{transform:translateY(0) scale(1.08,.92)}100%{transform:translateY(0)}}
#sci.blast{animation:blast .9s ease-out}
@keyframes blast{0%{transform:translateX(0)}10%{transform:translateX(-40px) rotate(-12deg)}25%{transform:translateX(14px) rotate(6deg)}40%{transform:translateX(-10px) rotate(-4deg)}60%{transform:translateX(6px) rotate(2deg)}100%{transform:none}}
#sci.dizzy{animation:dizzy 1.4s ease-in-out infinite}
@keyframes dizzy{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(4px)}}
#sci.shake-off{animation:shakeoff .7s ease-in-out}
@keyframes shakeoff{0%,100%{transform:none}20%{transform:rotate(-8deg) scale(1.03)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}

#stirSci{position:absolute;left:475px;top:46px;width:300px;height:300px;z-index:9;opacity:0;transform-origin:55% 95%;pointer-events:none}
#stirSci img,#stirSci canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 14px #0008)}
.av{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 12px 18px #0008)}
body.vid .fb{display:none}
body:not(.vid) .av{display:none}
body.vid #sci{animation:none}
body.vid #sci.dizzy{animation:none}
body.vid #stirSci.stirring{animation:none}
#sci.stirring{-webkit-mask-image:none;mask-image:none}
#sci.stirring #sciCv{transform:translate(-64px,-4px)}
#sciCv{transition:transform .25s}
#stirSci.stirring{opacity:1;animation:stir .42s ease-in-out infinite alternate}
@keyframes stir{0%{transform:rotate(-7deg) translateX(-12px)}100%{transform:rotate(7deg) translateX(12px) translateY(-4px)}}
#board{transition:top .45s cubic-bezier(.4,1.4,.5,1)}
#board.up{top:-84px !important}
/* flask */
#liq.masked{-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#flask{position:absolute;left:198px;top:292px;width:320px;height:320px;z-index:13;transform-origin:50% 92%}
#flask img{position:absolute;inset:0;width:100%;height:100%;z-index:2;filter:drop-shadow(0 14px 22px #0009)}
#flask svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#flask .glass-front{z-index:3;opacity:.45;mix-blend-mode:screen}
#flask.wobble{animation:wobble .28s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3.5deg) translateX(-3px)}75%{transform:rotate(3.5deg) translateX(3px)}}
#flask.rattle{animation:rattle .07s linear infinite}
@keyframes rattle{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-5px,2px) rotate(-3deg)}50%{transform:translate(4px,-3px) rotate(2deg)}75%{transform:translate(-3px,-2px) rotate(-1deg)}100%{transform:translate(5px,3px) rotate(3deg)}}
#flask.boing{animation:boing .7s cubic-bezier(.3,1.8,.4,1)}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.14,.88)}55%{transform:scale(.93,1.08)}100%{transform:scale(1)}}
#opSign{position:absolute;left:128px;top:166px;width:64px;height:64px;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#fff 0,#fff4c2 35%,#ffc02e 70%,#b26b00);border:4px solid #fff;box-shadow:0 0 0 3px #8a4b00,0 0 22px #ffd54a,0 5px 0 #6b3a00;color:#7a2a00;font-size:54px;font-weight:800;line-height:54px;text-align:center;text-shadow:0 2px 0 #fff;animation:opg 1.6s ease-in-out infinite}
@keyframes opg{50%{transform:scale(1.1);box-shadow:0 0 0 3px #8a4b00,0 0 36px #ffe066,0 5px 0 #6b3a00}}
#flame{position:absolute;left:144px;top:214px;width:32px;height:36px;z-index:4;border-radius:50% 50% 45% 45%;background:radial-gradient(ellipse at 50% 70%,#fff8 0,#7cc8ff 30%,#3a7bff 60%,transparent 72%);filter:blur(1px);animation:flame .18s infinite alternate;opacity:.9}
@keyframes flame{from{transform:scale(1,1)}to{transform:scale(.88,1.15) translateY(-3px)}}
#flask.hot #opSign{position:absolute;left:156px;top:202px;width:54px;height:54px;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc02e 55%,#b26b00);border:3px solid #fff3;box-shadow:0 0 18px #ffcc33,0 4px 0 #6b3a00;color:#5a2d00;font-size:44px;font-weight:800;line-height:50px;text-align:center;animation:opg 1.6s ease-in-out infinite}
@keyframes opg{50%{transform:scale(1.12);box-shadow:0 0 30px #ffe066,0 4px 0 #6b3a00}}
#flame{background:radial-gradient(ellipse at 50% 70%,#fff 0,#ffd23a 30%,#ff5a1f 60%,transparent 72%);transform:scale(1.4)}

/* target board */
#board{position:absolute;left:530px;top:-220px;width:440px;height:142px;z-index:14;transform-origin:50% -60px}
#board .eqrow{display:flex;align-items:center;gap:10px;margin-top:4px}
#board .eqrow.list .op{font-size:44px}
#board .eqrow.many{gap:6px}
#board .eqrow.many .slot{width:52px;height:56px;font-size:32px;border-radius:14px}
#board .eqrow.many .op{font-size:34px}
#board .eqrow.lots{gap:3px}
#board .eqrow.lots .slot{width:38px;height:46px;font-size:22px;border-radius:10px;border-width:3px}
#board .eqrow.lots .op{font-size:20px}
#board .eqrow.lots .num{font-size:50px;margin-left:4px}
#board{width:auto!important;min-width:440px;padding:0 18px}
#board .plate{position:relative;inset:auto;min-height:142px;padding:6px 22px}
#board .slot{width:70px;height:70px;border-radius:18px;border:4px dashed #ffe9b0aa;background:#0004;font-size:46px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;color:#ffe9b0aa}
#board .slot.fill{border-style:solid;color:#fff;text-shadow:0 3px 0 #0007;animation:slotpop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes slotpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
#board .slot.wait{animation:slotwait 1s ease-in-out infinite}
@keyframes slotwait{50%{border-color:#fff;transform:scale(1.06)}}
#board .op{font-size:54px;font-weight:800;color:#fff;line-height:1;text-shadow:0 0 14px #ffd54a,0 3px 0 #6b3a00}
#board .op.bad{color:#ff4d4d;text-shadow:0 0 14px #ff0000;animation:rattle .08s linear 6}
#board.good .plate{border-color:#7dff6b;box-shadow:inset 0 0 0 4px #3d2210,0 0 40px #7dff6b,0 14px 30px #000a}
#board .rope{position:absolute;top:-76px;width:5px;height:92px;background:repeating-linear-gradient(45deg,#c99b5a 0 6px,#8a6230 6px 12px);border-radius:3px}
#board .plate{position:absolute;inset:0;border-radius:22px;background:linear-gradient(#7b4a22,#5a3416);border:5px solid #e6b54f;box-shadow:inset 0 0 0 4px #3d2210,0 14px 30px #000a;display:flex;flex-direction:column;align-items:center;justify-content:center}
#board .lbl{font-size:24px;font-weight:700;color:#ffe9b0;line-height:1;margin-top:4px}
#board .num{font-size:62px;font-weight:800;line-height:1;color:var(--gold);text-shadow:0 0 18px #ffb300aa,0 4px 0 #6b3a00;letter-spacing:1px}
#board.drop{animation:drop 1s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes drop{from{top:-220px}to{top:128px}}
#board.swing{top:128px;animation:swing 3.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
#board.out{top:128px;animation:bout .45s ease-in forwards}
@keyframes bout{to{top:-240px}}
#fuse{position:absolute;left:24px;right:24px;bottom:-16px;height:10px;border-radius:6px;background:#0007;overflow:hidden;display:none}
#fuse i{position:absolute;inset:0;background:linear-gradient(90deg,#ff3d3d,#ffb02e,#7dff6b);transform-origin:right;border-radius:6px}

/* bottles */
.bottle{position:absolute;width:104px;height:135px;z-index:16;cursor:pointer;transform-origin:50% 50%}
.bottle .bob{position:absolute;inset:0;transition:transform .25s}
.bottle:hover .bob{transform:translateY(-10px) rotate(-3deg)}
.bottle .glass{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 8px #0007);transition:filter .8s}
.bottle .glow{position:absolute;left:10%;right:10%;top:38%;bottom:4%;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 70%);opacity:.55;mix-blend-mode:screen;animation:lglow 2.2s ease-in-out infinite;pointer-events:none}
@keyframes lglow{50%{opacity:.95;transform:scale(1.08)}}
.bottle .lip,.bottle .ctr{position:absolute;width:2px;height:2px;left:50%;pointer-events:none}.bottle .lip{top:3%}.bottle .ctr{top:55%}
.bottle .cork{position:absolute;left:33%;width:34%;top:-13%;height:auto;filter:drop-shadow(0 3px 3px #0006)}
.bottle .tag.t3{font-size:23px}
.bottle .tag{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%) scale(var(--s,1));width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8e6,#f1d9a8 70%,#d9b77a);border:3px solid #7a4a1f;box-shadow:0 3px 6px #0006,inset 0 0 6px #b9894a;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#3b1d00;line-height:1}
.bottle .key{position:absolute;bottom:-58px;left:50%;transform:translateX(-50%);font-size:13px;color:#fff9;font-weight:700}
.bottle.used{pointer-events:none}
.bottle.used .glass{filter:saturate(.2) brightness(1.35) opacity(.55) drop-shadow(0 6px 8px #0005)}
.bottle.used .glow,.bottle.used .tag{opacity:.35}
.bottle.locked{pointer-events:none}
.bottle.hint .bob{animation:hintpulse .5s ease-in-out infinite alternate}
@keyframes hintpulse{from{transform:translateY(0) scale(1);filter:drop-shadow(0 0 0 #fff)}to{transform:translateY(-14px) scale(1.12);filter:drop-shadow(0 0 22px #7dff6b)}}
.bottle.fixed{cursor:default;pointer-events:none}
.bottle.fixed .glass{filter:drop-shadow(0 0 14px #ffd54a) drop-shadow(0 6px 8px #0007)}
.badge{position:absolute;top:-50px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#ffd54a;color:#4a2600;font-weight:800;font-size:17px;padding:2px 12px;border-radius:12px;box-shadow:0 4px 0 #a86a00}
.pstand{position:absolute;width:96px;height:auto;z-index:14;pointer-events:none;filter:drop-shadow(0 6px 6px #0008)}
#table{position:absolute;left:-10px;width:1300px;top:590px;height:140px;z-index:11;background:url(img/table_wire.png) top center/100% auto no-repeat;filter:drop-shadow(0 -4px 10px #0006)}
#stand{display:none}
.corkfly{position:absolute;z-index:40;pointer-events:none}
.stream{position:absolute;z-index:13;width:16px;border-radius:8px;transform-origin:top;pointer-events:none;background-size:100% 40px;animation:flow .25s linear infinite}
@keyframes flow{to{background-position:0 40px}}

/* hud */
#hud{position:absolute;top:16px;right:20px;z-index:40;display:flex;gap:10px;align-items:center}
#hud .pill[hidden]{display:none}
.pill{background:#2a1450cc;border:3px solid #ffd54a;border-radius:20px;padding:2px 14px;font-weight:800;font-size:26px;display:flex;align-items:center;gap:6px;box-shadow:0 5px 0 #0006}
.pill.pulse{animation:ppulse .5s}
@keyframes ppulse{50%{transform:scale(1.25)}}
#streak{display:none;border-color:#ff8a2b}
#streak.on{display:flex;animation:fire .6s ease-in-out infinite alternate}
@keyframes fire{from{box-shadow:0 0 6px #ff6a00,0 5px 0 #0006}to{box-shadow:0 0 24px #ffb300,0 5px 0 #0006}}
#tools{position:absolute;top:16px;left:20px;z-index:40;display:flex;gap:10px}
.ibtn{width:52px;height:52px;border-radius:16px;border:3px solid #ffffff55;background:#2a1450cc;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #0006}
.ibtn:active{transform:translateY(3px);box-shadow:0 2px 0 #0006}
#prog{position:absolute;left:0;top:0;width:1280px;height:720px;z-index:12;pointer-events:none}
#prog svg{position:absolute;inset:0;overflow:visible}
#prog .flow{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:10 14;opacity:0;transition:opacity .4s;mix-blend-mode:screen}
#prog .seg.ok .flow{stroke:#ffe46b;opacity:.95;filter:drop-shadow(0 0 4px #ffd23a) drop-shadow(0 0 9px #ff9d00);animation:eflow .55s linear infinite}
#prog .seg.bad .flow{stroke:#ff5a3c;opacity:.5;stroke-dasharray:4 16;animation:eflow 1.8s linear infinite,flick 1.3s steps(2) infinite}
@keyframes eflow{to{stroke-dashoffset:-48}}
@keyframes flick{50%{opacity:.12}}
#prog .bl{position:absolute;width:42px;height:42px;border-radius:50%;box-shadow:0 3px 5px #0009}
#prog .bl img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s}
#prog .bl .on,#prog .bl .bad{opacity:0}
#prog .bl .halo{position:absolute;left:-24px;top:-24px;width:90px;height:90px;border-radius:50%;opacity:0;transition:opacity .4s;mix-blend-mode:screen;pointer-events:none}
#prog .bl.ok .on{opacity:1}#prog .bl.ok .halo{opacity:1;background:radial-gradient(circle,#ffd86acc 0,#ffb30040 45%,transparent 70%);animation:hglow 2.4s ease-in-out infinite}
#prog .bl.bad .bad{opacity:1;transition:none}#prog .bl.bad .off{opacity:0;transition:none}
#prog .bl.cur{animation:bcur 1.1s ease-in-out infinite}
@keyframes bcur{50%{box-shadow:0 0 0 3px #ffe066,0 0 14px #ffd54a}}
@keyframes hglow{50%{transform:scale(1.15)}}
#prog .bl.pop{animation:bpop .5s ease-out}
@keyframes bpop{40%{transform:scale(1.35)}}
#prog .bl.shake{animation:bshake .45s linear}
@keyframes bshake{20%{transform:translate(-3px,1px) rotate(-6deg)}40%{transform:translate(3px,-1px) rotate(5deg)}60%{transform:translate(-2px,0) rotate(-3deg)}80%{transform:translate(1px,0)}}

/* messages */
#msg{position:absolute;left:0;right:0;top:300px;text-align:center;z-index:45;pointer-events:none}
.boom{display:inline-block;font-size:120px;font-weight:800;color:#ffef3a;-webkit-text-stroke:6px #c21b00;paint-order:stroke fill;text-shadow:0 8px 0 #6b0d00;animation:boomin .7s cubic-bezier(.2,2,.4,1) forwards}
@keyframes boomin{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(-4deg)}}
.eq{display:inline-block;margin-top:6px;font-size:52px;font-weight:800;background:#1b0d36dd;border:4px solid #ffd54a;border-radius:24px;padding:0 26px;box-shadow:0 8px 0 #0007;animation:eqin .5s cubic-bezier(.2,1.6,.4,1) both}
.eq.good{border-color:#7dff6b}
.eq small{display:block;font-size:22px;color:#ffe9b0;margin-top:-6px}
@keyframes eqin{from{transform:translateY(30px) scale(.6);opacity:0}}
.fade{animation:fadeout .4s forwards}@keyframes fadeout{to{opacity:0;transform:translateY(-20px)}}
#bubble{position:absolute;z-index:44;width:230px;height:230px;border-radius:50%;left:1000px;top:150px;pointer-events:none;display:none;
 background:radial-gradient(circle at 32% 28%,#ffffffee 0 7%,#ffffff22 9%,transparent 30%),radial-gradient(circle at 50% 50%,transparent 58%,#a5f3fc66 72%,#f0abfc88 86%,#fde68a99 100%);
 box-shadow:inset 0 0 30px #ffffff55,0 0 40px #67e8f955;align-items:center;justify-content:center;font-size:54px;font-weight:800;color:#fff;text-shadow:0 3px 0 #5b21b6,0 0 16px #a78bfa}
#bubble.rise{display:flex;animation:brise 1.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes brise{0%{transform:translateY(160px) scale(.1)}60%{transform:translateY(-10px) scale(1.05)}80%{transform:translateY(0) scale(.97,1.03)}100%{transform:translateY(-6px) scale(1)}}
#bubble.pop{display:flex;animation:bpop .22s ease-out forwards}
@keyframes bpop{to{transform:scale(1.45);opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#world.shake{animation:wshake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes wshake{10%,90%{transform:translate(-4px,2px)}20%,80%{transform:translate(9px,-6px)}30%,50%,70%{transform:translate(-14px,8px) rotate(-.6deg)}40%,60%{transform:translate(14px,-8px) rotate(.6deg)}}
#tap{position:absolute;bottom:200px;right:60px;z-index:46;font-size:22px;font-weight:700;color:#fff;background:#0008;padding:4px 18px;border-radius:14px;display:none;animation:ppulse 1.2s infinite}

/* screens */
.screen{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#3b1a70ee,#140829f5)}
.screen.show{display:flex;animation:scr .4s ease-out}
@keyframes scr{from{opacity:0}}
.card{width:1060px;text-align:center}
#start{background:linear-gradient(90deg,rgba(20,8,41,0) 0%,rgba(20,8,41,.15) 26%,rgba(20,8,41,.9) 44%,rgba(20,8,41,.96) 100%);justify-content:flex-end}
.hub{width:760px;margin-left:auto;margin-right:24px;text-align:center}
#start .title{font-size:80px}
.sub2{font-size:24px;color:#e9d5ff;margin:4px 0 18px}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.topic{font-family:inherit;position:relative;height:172px;border-radius:26px;border:4px solid #ffffff55;cursor:pointer;color:#fff;background:radial-gradient(circle at 30% 20%,#ffffff40,transparent 45%),linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 8px 0 #0006,0 0 0 0 var(--c1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .2s,box-shadow .2s;animation:tin .5s cubic-bezier(.3,1.5,.5,1) both}
.topic:nth-child(2){animation-delay:.06s}.topic:nth-child(3){animation-delay:.12s}.topic:nth-child(4){animation-delay:.18s}.topic:nth-child(5){animation-delay:.24s}.topic:nth-child(6){animation-delay:.3s}
@keyframes tin{from{transform:translateY(40px) scale(.8);opacity:0}}
.topic:hover{transform:translateY(-8px) rotate(-1.5deg);box-shadow:0 14px 0 #0006,0 0 30px var(--c1)}
.topic:active{transform:translateY(2px)}
.topic .ti{font-size:56px;line-height:1;filter:drop-shadow(0 4px 0 #0005);animation:tl 2s ease-in-out infinite}
.topic b{font-size:34px;font-weight:800;text-shadow:0 3px 0 #0006}
.topic small{font-size:16px;opacity:.92;padding:0 10px}
.hubbar{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:16px}
.setbtn{font-family:inherit;font-size:22px;font-weight:800;color:#fff;background:#ffffff1a;border:3px solid #ffffff55;border-radius:16px;padding:6px 18px;cursor:pointer}
.sum{font-size:19px;color:#d8c5ff}

<script>
const $=s=>document.querySelector(s);
const stage=$('#stage'),world=$('#world'),sci=$('#sci'),flask=$('#flask');
const W=1280,H=720;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- settings ---------- */
const S={level:'prog',mulStyle:'pick2',vessel:'cauldron',mode:'mul',rounds:15,timer:0,digits:'ar',tables:new Set([2,3,4,5,6,7,8,9,10])};
const D=n=>{const s=String(n);return S.digits==='ar'?s.replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):s};
try{const sv=JSON.parse(localStorage.getItem('potionLab')||'null');if(sv){Object.assign(S,sv);S.tables=new Set(sv.tables);if(sv.mode==='pick2'||sv.mode==='fixed'){S.mulStyle=sv.mode;S.mode='mul'}}}catch(e){}
function save(){try{localStorage.setItem('potionLab',JSON.stringify({...S,tables:[...S.tables]}))}catch(e){}}
const tb=$('#tbls');
for(let i=1;i<=10;i++){const b=document.createElement('button');b.className='opt num';b.dataset.t=i;tb.appendChild(b)}
const LVN={easy:'سهل',med:'متوسط',hard:'صعب',prog:'متدرّج'};
function curLvl(){if(S.level!=='prog')return S.level||'med';const f=(typeof G!=='undefined'&&G)?G.i/Math.max(1,S.rounds):0;return f<1/3?'easy':f<2/3?'med':'hard'}
function paintSettings(){
 document.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',String(S[b.dataset.g])===b.dataset.v));
 document.querySelectorAll('[data-t]').forEach(b=>{b.textContent=D(b.dataset.t);b.classList.toggle('on',S.tables.has(+b.dataset.t))});
 document.querySelectorAll('[data-g=rounds]').forEach(b=>b.textContent=D(b.dataset.v));
 document.querySelectorAll('[data-g=timer]').forEach(b=>{if(b.dataset.v!=='0')b.textContent=D(b.dataset.v)+' ث'});
 const st=$('#sumTxt');if(st)st.textContent=`${LVN[S.level]||'متدرّج'} • ${D(S.rounds)} جولة • ${S.timer?'مؤقت '+D(S.timer)+' ث':'بدون مؤقت'}`;
}
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S[b.dataset.g]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;sfx.click();paintSettings();save()});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;S.tables.has(t)?S.tables.delete(t):S.tables.add(t);sfx.click();paintSettings();save()});
// animated title letters
$('#ttl').innerHTML='مختبر الجرعات'.split(' ').map((w,i)=>`<span style="animation-delay:${-i*.4}s">${w}</span>`).join(' ');
paintSettings();

/* ---------- audio ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.25,f2=null,delay=0){const a=ac();if(!a||muted)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.4,f1=1200,f2=80,delay=0,type='lowpass'){const a=ac();if(!a||muted)return;const t=a.currentTime+delay,len=a.sampleRate*d,b=a.createBuffer(1,len,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<len;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);const g=a.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(a.destination);s.start(t)}
const SND={},SNDV={cork:.9,glug:.8,pour:.8,bubble:.55,stir:.6,pop:.9,win:.8,boom:1,fizz:.5,cough:.8,whoosh:.5,clink:.6,drop:.6,fanfare:.8,ambience:.22,music:.28};
async function loadSnd(n){try{const a=ac();if(!a)return;const buf=await fetch('sfx/'+n+'.mp3').then(r=>r.arrayBuffer());SND[n]=await a.decodeAudioData(buf)}catch(e){}}
function playS(n,{vol=1,rate=1,loop=false,offset=0,dur}={}){const a=ac();const b=SND[n];if(!a||!b||muted)return null;const src=a.createBufferSource();src.buffer=b;src.loop=loop;src.playbackRate.value=rate;const g=a.createGain();g.gain.value=(SNDV[n]||1)*vol;src.connect(g).connect(a.destination);src.start(0,offset,dur);return{src,g,stop(t=.25){try{g.gain.setTargetAtTime(0,a.currentTime,t/3);src.stop(a.currentTime+t)}catch(e){}}}}
let soundsLoaded=false;

  else $('#msg').innerHTML=`<div class="eq good">${T0}${D(a)} × ${D(b)} = ${D(q.target)}<small>هذه هي الخلطة الصحيحة</small></div>`;
  bottles.forEach(x=>{if(x.isFixed)return;x.el.classList.remove('used');
   const need=q.mode==='fixed'?[b]:(q.mode==='div'||q.mode==='pattern')?[q.ans[0]]:[...q.ans];if(need.includes(x.n)){x.el.classList.add('hint');need.splice(need.indexOf(x.n),1)}});
  await waitOrSkip(2600);
 }
 G.i++;nextRound()}
const SCI_HOME_TO_FLASK={dx:420,dy:-372,s:.64};
async function goStir(){sfx.whoosh();if(vidOK){sci.classList.add('stirring');char.play('stir',{loop:true,rate:1.15})}else sci.className='lean';stirring=true;
 sci.animate([{transform:'none'},{transform:'translateY(14px) scale(1.03,.97)'},{transform:'none'}],{duration:320,easing:'ease-out'});await wait(200)}
async function backHome(){stirring=false;sci.className='';if(vidOK)char.play('idle',{loop:true})}
function floatText(t,x,y,c){const d=document.createElement('div');d.textContent=t;Object.assign(d.style,{position:'absolute',left:x+'px',top:y+'px',transform:'translate(-50%,-50%)',fontSize:'44px',fontWeight:800,color:c,textShadow:'0 4px 0 #0008',zIndex:46,pointerEvents:'none',whiteSpace:'nowrap'});world.appendChild(d);
 d.animate([{transform:'translate(-50%,0) scale(.3)',opacity:0},{transform:'translate(-50%,-30px) scale(1.2)',opacity:1,offset:.25},{transform:'translate(-50%,-110px) scale(1)',opacity:0}],{duration:1500,easing:'ease-out'}).onfinish=()=>d.remove()}
function waitOrSkip(ms){return new Promise(r=>{const t=$('#tap');t.style.display='block';const done=()=>{clearTimeout(to);skip=null;stage.removeEventListener('pointerdown',h);t.style.display='none';r()};const to=setTimeout(done,ms);const h=e=>{if(e.target.closest('.ibtn'))return;done()};setTimeout(()=>stage.addEventListener('pointerdown',h),400);skip=done})}

function endGame(){clearTimer();progPaint();
 const pct=G.correct/S.rounds;const n=pct>=.9?3:pct>=.7?2:1;
 emitPL('result',{topic:S.mode,level:S.level,tables:[...S.tables],correct:G.correct,total:S.rounds,score:G.score,stars:n,percent:Math.round(pct*100),mistakes:G.mist.map(describeQ),startedAt:G.t0,endedAt:new Date().toISOString()});
 $('#stars').querySelectorAll('span').forEach((s,i)=>{s.className='';if(i<n){setTimeout(()=>{s.className='lit';tone(600+i*200,.3,'triangle',.2,1200+i*200)},500+i*450)}});
 $('#endInfo').innerHTML=`أصبت ${D(G.correct)} من ${D(S.rounds)} &nbsp;•&nbsp; النقاط ⭐ ${D(G.score)}`;
 const seen=new Set();$('#mist').innerHTML=G.mist.length?'راجع هذه الحقائق: '+G.mist.filter(q=>{const k=q.mode+q.target+'_'+q.ans;if(seen.has(k))return false;seen.add(k);return true}).map(q=>q.mode==='div'?`<b>${D(q.fixed)} ÷ ${D(q.d)} = ${D(q.k)}</b>`:q.mode==='pattern'?`<b>${q.seq.map(D).join(' ، ')}</b>`:q.mode==='factors'?`<b>قواسم ${D(q.target)}: ${q.ans.map(D).join(' ، ')}</b>`:q.mode==='multiples'?`<b>مضاعفا ${D(q.target)}: ${D(q.ans[0])} ، ${D(q.ans[1])}</b>`:`<b>${D(q.ans[0])} × ${D(q.ans[1])} = ${D(q.target)}</b>`).join(' '):'عالِم حقيقي! ولا انفجار واحد 🎉';
 $('#end').classList.add('show');
 sfx.fanfare();if(n===3){for(let i=0;i<120;i++)emit({type:'confetti',x:rnd(0,1280),y:rnd(-200,-10),vx:rnd(-60,60),vy:rnd(150,300),g:60,size:rnd(10,16),vr:rnd(-8,8),life:4,color:pick(['#f43f5e','#facc15','#22d3ee','#a855f7','#4ade80'])})}}
/* =====================================================================
   واجهة الدمج — Integration API (for «سجل المتابعة» or any host page)
   ---------------------------------------------------------------------
   فتح مباشر بالرابط (query أو hash):
     index.html?topic=div&level=prog&rounds=10&timer=0&student=1234&name=أحمد&embed=1
     topic : mul | div | factors | multiples | pattern | mix
     host  : class | remote (يُرسله «سجل المتابعة») ، name : اسم اللاعب يظهر أعلى الشاشة
     level : easy | med | hard | prog      rounds : 10|15|20      timer : 0|10|20
     digits: ar | en          vessel : cauldron | orb | classic
     embed=1 : يخفي الإعدادات ويبدأ اللعب مباشرة
   الأحداث (postMessage إلى الصفحة الأم + window event 'potionlab'):
     {source:'potion-lab',version:1,type:'start'|'answer'|'result', student, ...}
     result => {correct,total,score,stars,percent,mistakes:[...],topic,level,startedAt,endedAt}
   من الصفحة الأم:  iframe.contentWindow.PotionLab.start({topic:'div',level:'prog'})
                    أو postMessage({source:'host',cmd:'start',topic:'div'})
   ===================================================================== */
const PL={student:null,name:null,host:''};
function describeQ(q){if(!q)return'';const t=q.target;switch(q.mode){case'pick2':case'fixed':return`${q.ans[0]}x${q.ans[1]}=${t}`;case'div':return`${q.fixed}/${q.d}=${q.k}`;case'factors':return`factors(${t})=${q.ans.join(',')}`;case'multiples':return`multiples(${t}):${q.ans.join(',')}`;case'pattern':return`pattern ${q.seq.join(',')} missing ${q.ans[0]} rule ${q.kind}`;default:return String(t)}}
function emitPL(type,data){const msg=Object.assign({source:'potion-lab',version:1,type,student:PL.student,name:PL.name,time:new Date().toISOString()},data);
 try{if(window.parent&&window.parent!==window)window.parent.postMessage(msg,'*')}catch(e){}
 try{window.dispatchEvent(new CustomEvent('potionlab',{detail:msg}))}catch(e){}
 try{if(window.PotionLab&&typeof window.PotionLab.onEvent==='function')window.PotionLab.onEvent(msg)}catch(e){}
 try{const h=JSON.parse(localStorage.getItem('potionLabLog')||'[]');h.push(msg);localStorage.setItem('potionLabLog',JSON.stringify(h.slice(-300)))}catch(e){}}
function applyOpts(o){if(!o)return;if(o.level&&LVN[o.level])S.level=o.level;
 if(o.topic)S.mode=o.topic;if(o.rounds)S.rounds=+o.rounds;if(o.timer!=null&&o.timer!=='')S.timer=+o.timer;if(o.digits)S.digits=o.digits;if(o.vessel)S.vessel=o.vessel;if(o.mulStyle)S.mulStyle=o.mulStyle;
 if(o.student)PL.student=String(o.student);if(o.name){PL.name=String(o.name).slice(0,40);const pn=$('#plName');if(pn){pn.hidden=false;pn.querySelector('span').textContent=PL.name}}if(o.host)PL.host=String(o.host);paintSettings()}
window.PotionLab={version:'1.0',onEvent:null,start(o){applyOpts(o||{});$('#start').classList.add('show');startGame()},configure:applyOpts,log(){try{return JSON.parse(localStorage.getItem('potionLabLog')||'[]')}catch(e){return[]}}};
window.addEventListener('message',e=>{const d=e.data;if(d&&d.source==='host'&&d.cmd==='start')window.PotionLab.start(d)});
setTimeout(()=>emitPL('ready',{}),300);
(function(){const src=new URLSearchParams(location.search);const h=location.hash.slice(1);if(h.includes('='))new URLSearchParams(h).forEach((v,k)=>src.set(k,v));
 const o={};src.forEach((v,k)=>o[k]=v);if(Object.keys(o).length){applyOpts(o);if(o.embed==='1'){document.body.classList.add('embed');if(o.topic)setTimeout(()=>startGame(),900)}}})();
applyVessel(S.vessel);
</script>
